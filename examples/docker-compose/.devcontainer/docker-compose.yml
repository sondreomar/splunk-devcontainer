services:
  sh1:
    hostname: sh1
    image: ghcr.io/sondreomar/splunk-devcontainer:latest
    volumes:
      - ..:/workspace
      - ../sh:/opt/splunk/etc/apps/sh

  hf1:
    hostname: hf1
    image: ghcr.io/sondreomar/splunk-devcontainer:latest
    volumes: [../hf:/opt/splunk/etc/apps/hf]

  hf2:
    hostname: hf2
    image: ghcr.io/sondreomar/splunk-devcontainer:latest
    volumes: [../hf:/opt/splunk/etc/apps/hf]

  uf1:
    hostname: uf1
    build:
      context: .
      dockerfile: uf-with-python.Dockerfile
    volumes: [../uf:/opt/splunkforwarder/etc/apps/uf]

  uf2:
    hostname: uf2
    build:
      context: .
      dockerfile: uf-with-python.Dockerfile
    volumes: [../uf:/opt/splunkforwarder/etc/apps/uf]
