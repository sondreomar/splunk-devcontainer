name: Test 9.4.6 Only

on:
  workflow_dispatch: # Manual trigger only

jobs:
  test-splunk-946:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [splunk, universalforwarder]
        include:
          - version: 9.4.5
            build: 8fb2a6c586a5
            platform: linux-amd64
          - version: 9.4.6
            build: 60284236e579
            platform: linux-amd64

    steps:
      - name: Echo versions
        run: |
          echo "Variant: ${{ matrix.variant }}"
          echo "Version: ${{ matrix.version }}"
          echo "Build: ${{ matrix.build }}"
          echo "Platform: ${{ matrix.platform }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Test download
        run: |
          wget --spider https://download.splunk.com/products/splunk/releases/9.4.6/linux/splunk-9.4.6-60284236e579-linux-amd64.tgz
          echo "Download URL is accessible"
