name: Benchmark

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Splunk version to benchmark (defaults to the newest in splunk-versions.json)"
        type: string
        default: ""
      build:
        description: "Build our images from the selected branch instead of pulling the published ones"
        type: boolean
        default: false
      runs:
        description: "Number of times to start and restart each image"
        type: number
        default: 5
      settle:
        description: "Seconds to wait after startup before sampling idle usage"
        type: number
        default: 180
      sample:
        description: "Seconds to sample idle CPU and memory for"
        type: number
        default: 300

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      platform: ${{ steps.version.outputs.platform }}
      local: ${{ inputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          entry=$(jq -c --arg v "$VERSION" 'if $v == "" then last else (map(select(.version == $v)) | first) end' .github/splunk-versions.json)
          if [[ "$entry" == null ]]; then
            echo "::error::$VERSION isn't in splunk-versions.json"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$entry" >> "$GITHUB_OUTPUT"

  benchmark:
    # Each phase compares all images on one runner, and the phases don't depend on each other
    name: ${{ matrix.phase }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        phase: [size, startup, idle]
    steps:
      - name: Disk space
        run: df -h .

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Buildx
        if: needs.setup.outputs.local == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Node.js
        if: needs.setup.outputs.local == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.19.4"

      # Building in each job is faster than sharing the images as an artifact
      - name: Build
        if: needs.setup.outputs.local == 'true'
        env:
          SPLUNK_VERSION: ${{ needs.setup.outputs.version }}
          SPLUNK_BUILD: ${{ needs.setup.outputs.build }}
          SPLUNK_PLATFORM: ${{ needs.setup.outputs.platform }}
        run: |
          npm install -g @devcontainers/cli@0.80.0
          names=() pids=()
          for variant in splunk:: splunk:-slim:true universalforwarder:-uf:; do
            IFS=: read -r workspace suffix slim <<< "$variant"
            # A separate folder per variant, so parallel builds don't share the CLI's intermediate image names
            folder="$RUNNER_TEMP/$workspace$suffix"
            cp -r "src/$workspace" "$folder"
            SPLUNK_SLIM=$slim devcontainer build --workspace-folder "$folder" \
              --image-name "local/splunk-devcontainer:$SPLUNK_VERSION$suffix" > "$folder.log" 2>&1 &
            names+=("$workspace$suffix") pids+=($!)
          done
          failed=0
          for i in "${!pids[@]}"; do
            status=0
            wait "${pids[i]}" || status=$?
            echo "::group::${names[i]} ($( ((status)) && echo failed || echo built))"
            cat "$RUNNER_TEMP/${names[i]}.log"
            echo "::endgroup::"
            if ((status)); then
              echo "::error::Building ${names[i]} failed"
              failed=1
            fi
          done
          exit $failed

      - name: Benchmark
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          OURS: ${{ needs.setup.outputs.local == 'true' && 'local/splunk-devcontainer' || format('ghcr.io/{0}', github.repository) }}
          SOURCE: ${{ needs.setup.outputs.local == 'true' && format('built from {0} ({1})', github.ref_name, github.sha) || 'published' }}
          RUNS: ${{ inputs.runs }}
          SETTLE: ${{ inputs.settle }}
          SAMPLE: ${{ inputs.sample }}
          MODE: ${{ matrix.phase }}
          OUT: results
        run: |
          {
            echo "## Splunk $VERSION: $MODE"
            echo
            echo "Our images: $SOURCE. Median (min–max)."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/benchmark.sh \
            "official=splunk/splunk:$VERSION" \
            "ours=$OURS:$VERSION" \
            "ours-slim=$OURS:$VERSION-slim" \
            "official-uf=splunk/universalforwarder:$VERSION" \
            "ours-uf=$OURS:$VERSION-uf" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "<details><summary>Raw results</summary>"
            echo
            echo '```tsv'
            cat "results-$MODE.tsv"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
