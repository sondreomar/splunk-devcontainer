name: Release devcontainer

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:
    inputs:
      all_versions:
        description: "Build all versions, not just those added or affected since the previous release"
        type: boolean
        default: false
      variant:
        description: "Variant to build"
        type: choice
        options: [all, splunk, splunk-slim, universalforwarder]
        default: all

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  versions:
    uses: ./.github/workflows/prepare.yml
    permissions:
      contents: read
    with:
      image_tag: ${{ github.ref_name }}
      build: ${{ inputs.all_versions && 'all' || 'release' }}

  build-and-push:
    needs: versions
    if: needs.versions.outputs.splunk_builds != '[]'
    strategy:
      fail-fast: false
      # One variant at a time, as each already runs up to 15 builds in parallel
      max-parallel: 1
      matrix:
        # Tag pushes have no inputs, so they build every variant
        variant: ${{ fromJSON((!inputs.variant || inputs.variant == 'all') && '["splunk","splunk-slim","universalforwarder"]' || format('["{0}"]', inputs.variant)) }}
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    with:
      variant: ${{ matrix.variant }}
      versions: ${{ needs.versions.outputs.splunk_builds }}
      image_version: ${{ needs.versions.outputs.image_version }}
      image_major: ${{ needs.versions.outputs.image_major }}
      image_minor: ${{ needs.versions.outputs.image_minor }}
      splunk_latest: ${{ needs.versions.outputs.splunk_latest }}
      splunk_major: ${{ needs.versions.outputs.splunk_major }}
      splunk_minor: ${{ needs.versions.outputs.splunk_minor }}
      splunk_patch: ${{ needs.versions.outputs.splunk_patch }}
      push: true
      allow_failures: true

  delete-untagged-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Delete untagged images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-type: container
          package-name: ${{ github.event.repository.name }}
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
