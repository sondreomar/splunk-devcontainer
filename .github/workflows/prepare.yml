name: Prepare version metadata

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Git tag for the image version (e.g. v1.0.0)"
        required: true
        type: string
      build:
        description: "Versions to build: 'release' (added since the previous release, plus the newest in each minor line if the image changed), 'test' (newest in each minor line, plus any added by the PR) or 'all'"
        required: true
        type: string
    outputs:
      image_version:
        description: "Image semver version (X.Y.Z)"
        value: ${{ jobs.prepare.outputs.image_version }}
      image_major:
        description: "Image major version (X)"
        value: ${{ jobs.prepare.outputs.image_major }}
      image_minor:
        description: "Image major.minor version (X.Y)"
        value: ${{ jobs.prepare.outputs.image_minor }}
      splunk_versions:
        description: "JSON array of all Splunk versions"
        value: ${{ jobs.prepare.outputs.splunk_versions }}
      splunk_latest:
        description: "Latest Splunk version"
        value: ${{ jobs.prepare.outputs.splunk_latest }}
      splunk_major:
        description: "JSON object keyed by full version (e.g. '10.4.0') to its major tag (e.g. '10'), only for the latest patch per major line"
        value: ${{ jobs.prepare.outputs.splunk_major }}
      splunk_minor:
        description: "JSON object keyed by full version (e.g. '9.4.11') to its minor tag (e.g. '9.4'), only for the latest patch per minor line"
        value: ${{ jobs.prepare.outputs.splunk_minor }}
      splunk_patch:
        description: "JSON object keyed by full version (e.g. '10.6.1.1') to its patch tag (e.g. '10.6.1'), only for the latest maintenance release per patch line"
        value: ${{ jobs.prepare.outputs.splunk_patch }}
      splunk_builds:
        description: "JSON array of the versions to build, each with version, build and platform"
        value: ${{ jobs.prepare.outputs.splunk_builds }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_version: ${{ steps.image_semver.outputs.version }}
      image_major: ${{ steps.image_semver.outputs.major }}
      image_minor: ${{ steps.image_semver.outputs.minor }}
      splunk_versions: ${{ steps.splunk_semver.outputs.versions }}
      splunk_latest: ${{ steps.splunk_semver.outputs.latest }}
      splunk_major: ${{ steps.splunk_semver.outputs.major }}
      splunk_minor: ${{ steps.splunk_semver.outputs.minor }}
      splunk_patch: ${{ steps.splunk_semver.outputs.patch }}
      splunk_builds: ${{ steps.builds.outputs.builds }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Image version
        id: image_semver
        run: |
          # Extract version from tag (v1.0.0 -> 1.0.0)
          version="${{ inputs.image_tag }}"
          version="${version#refs/tags/v}"
          version="${version#v}"

          # Validate semver format (X.Y.Z)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid semver tag: v$version. Expected format: vX.Y.Z"
            exit 1
          fi

          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f1-2)

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "major=$major" >> $GITHUB_OUTPUT
          echo "minor=$minor" >> $GITHUB_OUTPUT

      - name: Splunk versions
        id: splunk_semver
        run: |
          # Tags come from every version, so building only some of them never moves a tag to an older version
          versions=$(jq -c '[.[].version]' .github/splunk-versions.json)
          sorted=$(echo "$versions" | jq -r '.[]' | sort -V | jq -R . | jq -sc .)

          latest=$(echo "$sorted" | jq -r '.[-1]')
          major=$(echo "$sorted" | jq -c 'group_by(split(".")[0]) | map({(last): .[0] | split(".")[0]}) | add')
          minor=$(echo "$sorted" | jq -c 'group_by(split(".")[0:2] | join(".")) | map({(last): .[0] | split(".")[0:2] | join(".")}) | add')
          # X.Y.Z versions already carry their patch tag as their exact tag
          patch=$(echo "$sorted" | jq -c 'group_by(split(".")[0:3] | join(".")) | map(last | select(split(".") | length > 3) | {(.): split(".")[0:3] | join(".")}) | add // {}')

          # Debug output
          echo "All versions:"
          echo "$versions" | jq .
          echo "Latest version: $latest"
          echo "Major version mappings:"
          echo "$major" | jq .
          echo "Minor version mappings:"
          echo "$minor" | jq .
          echo "Patch version mappings:"
          echo "$patch" | jq .

          echo "versions=$versions" >> $GITHUB_OUTPUT
          echo "latest=$latest" >> $GITHUB_OUTPUT
          echo "major=$major" >> $GITHUB_OUTPUT
          echo "minor=$minor" >> $GITHUB_OUTPUT
          echo "patch=$patch" >> $GITHUB_OUTPUT

      - name: Versions to build
        id: builds
        env:
          BUILD: ${{ inputs.build }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          file=.github/splunk-versions.json
          # Skip X.Y.Z when an X.Y.Z.N exists, as the latter owns the X.Y.Z tag
          all=$(jq -c '. as $all | map(select(.version as $v | $all | any(.version | startswith($v + ".")) | not) | {version, build, platform})' "$file")
          newest=$(echo "$all" | jq -c 'group_by(.version | split(".")[0:2]) | map(max_by(.version | split(".") | map(tonumber)))')

          added_since() {
            local previous
            previous=$(git show "$1:$file" 2>/dev/null || echo '[]')
            echo "$all" | jq -c --argjson previous "$previous" '[$previous[].version] as $old | map(select(.version | IN($old[]) | not))'
          }
          merge() {
            jq -cn --argjson a "$1" --argjson b "$2" '$a + $b | unique_by(.version)'
          }

          case "$BUILD" in
            all)
              builds="$all"
              ;;
            test)
              builds="$newest"
              if [[ -n "$PR_BASE" ]]; then
                builds=$(merge "$builds" "$(added_since "$PR_BASE")")
              fi
              ;;
            release)
              previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^ 2>/dev/null || true)
              if [[ -z "$previous_tag" ]]; then
                echo "No previous release, building all versions"
                builds="$all"
              else
                echo "Previous release: $previous_tag"
                builds=$(added_since "$previous_tag")
                if ! git diff --quiet "$previous_tag" HEAD -- src .github/workflows/build-image.yml; then
                  echo "Image changed since $previous_tag, rebuilding the newest version in each minor line"
                  builds=$(merge "$builds" "$newest")
                fi
              fi
              ;;
            *)
              echo "::error::Unknown build selection: $BUILD"
              exit 1
              ;;
          esac

          echo "Versions to build:"
          echo "$builds" | jq -r '.[].version'
          echo "builds=$builds" >> $GITHUB_OUTPUT
