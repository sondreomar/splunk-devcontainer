name: Build devcontainer image

on:
  workflow_call:
    inputs:
      variant:
        description: "Image variant to build: splunk, splunk-slim or universalforwarder"
        required: true
        type: string
      versions:
        description: "JSON array of the versions to build, each with version, build and platform"
        required: true
        type: string
      image_version:
        description: "Image semver version (X.Y.Z)"
        required: true
        type: string
      image_major:
        description: "Image major version (X)"
        required: true
        type: string
      image_minor:
        description: "Image major.minor version (X.Y)"
        required: true
        type: string
      splunk_latest:
        description: "Latest Splunk version"
        required: true
        type: string
      splunk_major:
        description: "JSON object keyed by full version (e.g. '10.4.0') to its major tag (e.g. '10'), only for the latest patch per major line"
        required: true
        type: string
      splunk_minor:
        description: "JSON object keyed by full version (e.g. '9.4.11') to its minor tag (e.g. '9.4'), only for the latest patch per minor line"
        required: true
        type: string
      splunk_patch:
        description: "JSON object keyed by full version (e.g. '10.6.1.1') to its patch tag (e.g. '10.6.1'), only for the latest maintenance release per patch line"
        required: true
        type: string
      push:
        description: "Push images to registry after building"
        required: false
        type: boolean
        default: false
      allow_failures:
        description: "Whether to allow individual build failures"
        required: false
        type: boolean
        default: false
      max_parallel:
        description: "Maximum number of versions to build at the same time"
        required: false
        type: number
        default: 15

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      workspace: ${{ steps.variant.outputs.workspace }}
      suffix: ${{ steps.variant.outputs.suffix }}
      slim: ${{ steps.variant.outputs.slim }}
    steps:
      - name: Variant
        id: variant
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          case "$VARIANT" in
            splunk) workspace=splunk suffix= slim= ;;
            splunk-slim) workspace=splunk suffix=-slim slim=true ;;
            universalforwarder) workspace=universalforwarder suffix=-uf slim= ;;
            *) echo "::error::Unknown variant: $VARIANT"; exit 1 ;;
          esac
          echo "workspace=$workspace" >> $GITHUB_OUTPUT
          echo "suffix=$suffix" >> $GITHUB_OUTPUT
          echo "slim=$slim" >> $GITHUB_OUTPUT

      - name: Matrix
        id: parse
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          matrix=$(echo "$VERSIONS" | jq -c '{version: map(.version), include: .}')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  image:
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.allow_failures }}

    strategy:
      fail-fast: ${{ !inputs.allow_failures }}
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df . -h
          sudo rm -rf \
            /usr/share/swift \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go
          echo "Disk usage after cleanup:"
          df . -h

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.19.4"

      - name: Dev Container CLI
        run: npm install -g @devcontainers/cli@0.80.0

      - name: Build
        env:
          WORKSPACE: ${{ needs.setup.outputs.workspace }}
          SUFFIX: ${{ needs.setup.outputs.suffix }}
          SPLUNK_SLIM: ${{ needs.setup.outputs.slim }}
          SPLUNK_VERSION: ${{ matrix.version }}
          SPLUNK_BUILD: ${{ matrix.build }}
          SPLUNK_PLATFORM: ${{ matrix.platform }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SPLUNK_LATEST: ${{ matrix.version == inputs.splunk_latest && 'true' || '' }}
          SPLUNK_MAJOR: ${{ fromJson(inputs.splunk_major)[matrix.version] || '' }}
          SPLUNK_MINOR: ${{ fromJson(inputs.splunk_minor)[matrix.version] || '' }}
          SPLUNK_PATCH: ${{ fromJson(inputs.splunk_patch)[matrix.version] || '' }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          IMAGE_MAJOR: ${{ inputs.image_major }}
          IMAGE_MINOR: ${{ inputs.image_minor }}
        run: |
          devcontainer build \
            --workspace-folder $GITHUB_WORKSPACE/src/$WORKSPACE \
            --image-name $IMAGE_REF:$SPLUNK_VERSION$SUFFIX \
            --image-name $IMAGE_REF:$SPLUNK_VERSION$SUFFIX-v$IMAGE_VERSION \
            --image-name $IMAGE_REF:$SPLUNK_VERSION$SUFFIX-v$IMAGE_MINOR \
            --image-name $IMAGE_REF:$SPLUNK_VERSION$SUFFIX-v$IMAGE_MAJOR \
            ${SPLUNK_PATCH:+--image-name $IMAGE_REF:${SPLUNK_PATCH}${SUFFIX}} \
            ${SPLUNK_PATCH:+--image-name $IMAGE_REF:${SPLUNK_PATCH}${SUFFIX}-v${IMAGE_VERSION}} \
            ${SPLUNK_PATCH:+--image-name $IMAGE_REF:${SPLUNK_PATCH}${SUFFIX}-v${IMAGE_MINOR}} \
            ${SPLUNK_PATCH:+--image-name $IMAGE_REF:${SPLUNK_PATCH}${SUFFIX}-v${IMAGE_MAJOR}} \
            ${SPLUNK_MINOR:+--image-name $IMAGE_REF:${SPLUNK_MINOR}${SUFFIX}} \
            ${SPLUNK_MINOR:+--image-name $IMAGE_REF:${SPLUNK_MINOR}${SUFFIX}-v${IMAGE_VERSION}} \
            ${SPLUNK_MINOR:+--image-name $IMAGE_REF:${SPLUNK_MINOR}${SUFFIX}-v${IMAGE_MINOR}} \
            ${SPLUNK_MINOR:+--image-name $IMAGE_REF:${SPLUNK_MINOR}${SUFFIX}-v${IMAGE_MAJOR}} \
            ${SPLUNK_MAJOR:+--image-name $IMAGE_REF:${SPLUNK_MAJOR}${SUFFIX}} \
            ${SPLUNK_MAJOR:+--image-name $IMAGE_REF:${SPLUNK_MAJOR}${SUFFIX}-v${IMAGE_VERSION}} \
            ${SPLUNK_MAJOR:+--image-name $IMAGE_REF:${SPLUNK_MAJOR}${SUFFIX}-v${IMAGE_MINOR}} \
            ${SPLUNK_MAJOR:+--image-name $IMAGE_REF:${SPLUNK_MAJOR}${SUFFIX}-v${IMAGE_MAJOR}} \
            ${SPLUNK_LATEST:+--image-name $IMAGE_REF:latest${SUFFIX}}

      - name: Smoke test
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}${{ needs.setup.outputs.suffix }}
          WORKSPACE: ${{ needs.setup.outputs.workspace }}
          SLIM: ${{ needs.setup.outputs.slim }}
        run: |
          setup=
          if [[ "$WORKSPACE" == universalforwarder ]]; then
            # The forwarder only offers management over a local socket by default
            setup='mkdir -p "$SPLUNK_HOME/etc/system/local" && printf "[httpServer]\nmgmtMode = tcp\ndisableDefaultPort = false\n" > "$SPLUNK_HOME/etc/system/local/server.conf" && chown -R splunk:splunk "$SPLUNK_HOME/etc/system/local" && '
          fi
          docker run -d --name smoke -e SPLUNK_START_ARGS=--accept-license -e SPLUNK_PASSWORD=smoketest \
            --entrypoint sh "$IMAGE" -c "${setup}exec /sbin/entrypoint.sh"
          trap 'docker rm -f -v smoke > /dev/null' EXIT
          api() { docker exec smoke curl -sfk --connect-timeout 5 --max-time 30 -u admin:smoketest "https://localhost:8089$1"; }
          web() { docker exec smoke curl -sf --connect-timeout 5 --max-time 30 -o /dev/null "http://localhost:8000$1"; }
          splunkd_up() { api /services/server/info > /dev/null; }
          kvstore_ready() { [[ "$(api '/services/kvstore/status?output_mode=json' | jq -r '.entry[0].content.current.status')" == ready ]]; }
          supervisor_log() { docker exec smoke sh -c 'cat "$SPLUNK_HOME/var/log/splunk/supervisor.log" 2> /dev/null' || true; }
          # Every packaged sidecar is started, unless a server.conf feature flag skips it. The supervisor logs JSON with
          # sidecar IDs of <name>-<uuid>, except in older 9.3 and 9.4 patches, which log 'starting sidecar "<name>"'
          sidecars_started() {
            local log name missing=
            log=$(supervisor_log)
            for name in $(awk '/^[^ -]/ { s = $1 } s == "packages:" && /^[- ] name: / { print $NF }' <<< "$manifest"); do
              grep -qE "\"message\":\"(Starting a sidecar\".*\"sidecarI[Dd]\":\"$name-[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}\"|Skipping package[^\"]*\".*\"name\":\"$name\")|starting sidecar \"$name\"" <<< "$log" \
                || missing+=" $name"
            done
            [[ -z "$missing" ]] || { echo "Sidecars not started yet:$missing"; return 1; }
          }

          wait_for() {
            local error=$1 deadline=$((SECONDS + $2)) timeout=$2
            shift 2
            while ((SECONDS < deadline)); do
              "$@" && return 0
              if [[ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]]; then
                docker logs smoke
                echo "::error::Container exited during startup"
                exit 1
              fi
              sleep 5
            done
            docker logs smoke
            echo "::error::$error within $((timeout / 60)) minutes"
            exit 1
          }

          wait_for "Splunk didn't respond on port 8089" 300 splunkd_up

          validate_status=0
          validate=$(docker exec -u splunk smoke sh -c '"$SPLUNK_HOME/bin/splunk" validate files' 2>&1) || validate_status=$?
          echo "$validate"
          if ((validate_status != 0)) || ! grep -q "All installed files intact" <<< "$validate"; then
            echo "::error::Installed files don't match Splunk's manifest"
            exit 1
          fi

          # Every sidecar left in the supervisor manifest (pre-10.6 and 10.6 layouts) must have its package
          manifest=$(docker exec smoke sh -c 'cat "$SPLUNK_HOME/etc/packages/manifest.yaml" 2> /dev/null' || true)
          packages=$(docker exec smoke sh -c 'ls "$SPLUNK_HOME/opt/packages" 2> /dev/null' || true)
          missing=$(comm -23 <(sed -n 's/^[- ] file: //p' <<< "$manifest" | sort) <(sort <<< "$packages"))
          orphans=$(awk '/^[^ -]/ { s = $1 } s == "features:" && /^[- ] name: / { f[$NF] }
            s == "packages:" && /^[- ] feature: / { p[$NF] } END { for (n in f) if (!(n in p)) print n }' <<< "$manifest")
          if [[ -n "$missing$orphans" ]]; then
            echo "::error::The supervisor manifest references sidecars that aren't installed: $missing $orphans"
            exit 1
          fi

          if [[ "$WORKSPACE" == splunk ]]; then
            wait_for "KV store wasn't ready" 180 kvstore_ready
            wait_for "Splunk Web didn't respond on port 8000" 120 web /en-US/account/login
            if ! web /en-US/static/js/i18n.js; then
              echo "::error::Splunk Web didn't serve its static files"
              exit 1
            fi
            wait_for "The supervisor didn't start every sidecar" 120 sidecars_started
            # The full image's Edge Processor sidecar keeps failing to start, so only slim can be held to this
            if [[ "$SLIM" == true ]] && grep '"message":"Start failed, retry"' <<< "$(supervisor_log)"; then
              echo "::error::A sidecar failed to start"
              exit 1
            fi
          fi

          messages=$(api '/services/messages?output_mode=json&count=0' | jq -r '.entry[].content.message')
          echo "$messages"
          if grep -qi integrity <<< "$messages"; then
            echo "::error::Splunk reported a file integrity problem"
            exit 1
          fi

          # Record what the sidecar manifest holds and what actually started, for reviewers
          if [[ -z "$manifest" ]]; then
            layout="none"
          elif grep -q '^features:' <<< "$manifest"; then
            layout="10.6 (features and packages)"
          else
            layout="pre-10.6 (packages only)"
          fi
          log=$(supervisor_log)
          listed=$(awk '/^[^ -]/ { s = $1 } s == "packages:" && /^[- ] name: / { print $NF }' <<< "$manifest" | sort | paste -sd ' ')
          started=$({
            grep '"message":"Starting a sidecar"' <<< "$log" | grep -oE '"sidecarI[Dd]":"[^"]*"' | sed -E 's/.*":"//; s/-[0-9a-f-]{36}"$//'
            grep -oE 'starting sidecar "[^"]*"' <<< "$log" | cut -d '"' -f 2
          } | sort -u | paste -sd ' ' || true)
          skipped=$(grep '"message":"Skipping package' <<< "$log" | grep -oE '"name":"[^"]*"' | cut -d '"' -f 4 | sort -u | paste -sd ' ' || true)
          failures=$(grep -c '"message":"Start failed, retry"' <<< "$log" || true)
          {
            echo "### Smoke test: \`$IMAGE\`"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Sidecar manifest | $layout |"
            echo "| Sidecars in manifest | ${listed:-none} |"
            echo "| Started | ${started:-none} |"
            echo "| Skipped by a feature flag | ${skipped:-none} |"
            echo "| Repeated start failures | $failures |"
            echo "| \`splunk validate files\` | All installed files intact |"
            if [[ "$WORKSPACE" == splunk ]]; then
              echo "| KV store | ready |"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push
        if: inputs.push
        id: push
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION_TAG: ${{ matrix.version }}${{ needs.setup.outputs.suffix }}
        run: |
          docker push --all-tags $IMAGE_REF
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF:$VERSION_TAG" | cut -d@ -f2)
          echo "digest=$digest" >> $GITHUB_OUTPUT

      - name: Attest
        if: inputs.push
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
