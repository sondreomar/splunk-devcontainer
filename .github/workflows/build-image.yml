name: Build devcontainer image

on:
  workflow_call:
    inputs:
      image_version:
        description: "Image semver version (X.Y.Z)"
        required: true
        type: string
      image_major:
        description: "Image major version (X)"
        required: true
        type: string
      image_minor:
        description: "Image major.minor version (X.Y)"
        required: true
        type: string
      splunk_latest:
        description: "Latest Splunk version"
        required: true
        type: string
      splunk_major:
        description: "JSON object keyed by full version (e.g. '10.4.0') to its major tag (e.g. '10'), only for the latest patch per major line"
        required: true
        type: string
      splunk_minor:
        description: "JSON object keyed by full version (e.g. '9.4.11') to its minor tag (e.g. '9.4'), only for the latest patch per minor line"
        required: true
        type: string
      push:
        description: "Push images to registry after building"
        required: false
        type: boolean
        default: false
      allow_failures:
        description: "Whether to allow individual build failures"
        required: false
        type: boolean
        default: false
      all_versions:
        description: "Build all versions, including inactive"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/splunk-versions.json
          sparse-checkout-cone-mode: false

      - name: Parse versions
        id: parse
        env:
          ALL_VERSIONS: ${{ inputs.all_versions }}
        run: |
          filter='[.[] | select(.active)]'
          if [[ "$ALL_VERSIONS" == "true" ]]; then
            filter='.'
          fi
          matrix=$(jq -c "$filter | {
            variant: [\"splunk\", \"universalforwarder\"],
            version: [.[].version],
            include: ([
              {variant: \"splunk\", suffix: \"\"},
              {variant: \"universalforwarder\", suffix: \"-uf\"}
            ] + .)
          }" .github/splunk-versions.json)
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  image:
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.allow_failures }}

    strategy:
      fail-fast: ${{ !inputs.allow_failures }}
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df . -h
          sudo rm -rf \
            /usr/share/swift \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go
          echo "Disk usage after cleanup:"
          df . -h

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Login
        if: inputs.push
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20.19.4"

      - name: Dev Container CLI
        run: npm install -g @devcontainers/cli@0.80.0

      - name: Build
        env:
          VARIANT: ${{ matrix.variant }}
          SUFFIX: ${{ matrix.suffix }}
          SPLUNK_VERSION: ${{ matrix.version }}
          SPLUNK_BUILD: ${{ matrix.build }}
          SPLUNK_PLATFORM: ${{ matrix.platform }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SPLUNK_LATEST: ${{ matrix.version == inputs.splunk_latest && 'true' || '' }}
          SPLUNK_MAJOR: ${{ fromJson(inputs.splunk_major)[matrix.version] || '' }}
          SPLUNK_MINOR: ${{ fromJson(inputs.splunk_minor)[matrix.version] || '' }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          IMAGE_MAJOR: ${{ inputs.image_major }}
          IMAGE_MINOR: ${{ inputs.image_minor }}
        run: |
          devcontainer build \
            --workspace-folder $GITHUB_WORKSPACE/src/$VARIANT \
            --image-name $IMAGE_REF:$SPLUNK_VERSION$SUFFIX \
            --image-name $IMAGE_REF:$SPLUNK_VERSION$SUFFIX-v$IMAGE_VERSION \
            --image-name $IMAGE_REF:$SPLUNK_VERSION$SUFFIX-v$IMAGE_MINOR \
            --image-name $IMAGE_REF:$SPLUNK_VERSION$SUFFIX-v$IMAGE_MAJOR \
            ${SPLUNK_MINOR:+--image-name $IMAGE_REF:${SPLUNK_MINOR}${SUFFIX}} \
            ${SPLUNK_MINOR:+--image-name $IMAGE_REF:${SPLUNK_MINOR}${SUFFIX}-v${IMAGE_VERSION}} \
            ${SPLUNK_MINOR:+--image-name $IMAGE_REF:${SPLUNK_MINOR}${SUFFIX}-v${IMAGE_MINOR}} \
            ${SPLUNK_MINOR:+--image-name $IMAGE_REF:${SPLUNK_MINOR}${SUFFIX}-v${IMAGE_MAJOR}} \
            ${SPLUNK_MAJOR:+--image-name $IMAGE_REF:${SPLUNK_MAJOR}${SUFFIX}} \
            ${SPLUNK_MAJOR:+--image-name $IMAGE_REF:${SPLUNK_MAJOR}${SUFFIX}-v${IMAGE_VERSION}} \
            ${SPLUNK_MAJOR:+--image-name $IMAGE_REF:${SPLUNK_MAJOR}${SUFFIX}-v${IMAGE_MINOR}} \
            ${SPLUNK_MAJOR:+--image-name $IMAGE_REF:${SPLUNK_MAJOR}${SUFFIX}-v${IMAGE_MAJOR}} \
            ${SPLUNK_LATEST:+--image-name $IMAGE_REF:latest${SUFFIX}}

      - name: Push
        if: inputs.push
        id: push
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION_TAG: ${{ matrix.version }}${{ matrix.suffix }}
        run: |
          docker push --all-tags $IMAGE_REF
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF:$VERSION_TAG" | cut -d@ -f2)
          echo "digest=$digest" >> $GITHUB_OUTPUT

      - name: Attest
        if: inputs.push
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
